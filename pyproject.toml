[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "middle-man"
version = "0.1.0a1"
description = "Educational LLM serving simulator and local repository context gateway."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Middle_Man contributors"}]
keywords = ["llm", "inference", "scheduler", "kv-cache", "mcp", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = ["matplotlib>=3.8"]
mcp = ["mcp>=2,<3"]

[project.scripts]
middle-man = "middle_man.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"middle_man.gateway.codex_benchmark" = ["*.schema.json"]

[tool.setuptools.packages.find]
include = ["middle_man*"]
