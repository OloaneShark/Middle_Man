  <text x="28" y="294" fill="#202C33" font-family="Arial, sans-serif" font-size="15" font-weight="700">Task A v4 / MCP one-shot</text>
  <text x="28" y="316" fill="#087E72" font-family="Arial, sans-serif" font-size="13" font-weight="700">PASS / PASS</text>
  <text x="320" y="294" fill="#202C33" font-family="Arial, sans-serif" font-size="14" font-weight="700">86,143 -&gt; 156,138 input</text>
  <text x="758" y="294" fill="#B44C39" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="end">+81.3%</text>
