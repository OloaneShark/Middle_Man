<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="655" viewBox="0 0 1030 655" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Codex-reported input tokens by frozen pair</title>
  <desc id="chart-description">Paired horizontal bars compare baseline and Middle_Man input tokens for five complete pairs. One anchor run has no optimized provider usage. Each row is an independent run, not a pooled estimate.</desc>
  <rect x="0" y="0" width="1030" height="655" fill="#FFFFFF" />
  <text x="28" y="42" fill="#202C33" font-family="Arial, sans-serif" font-size="25" font-weight="700">Codex-reported input tokens</text>
  <text x="28" y="68" fill="#5B6870" font-family="Arial, sans-serif" font-size="14" font-weight="400">Independent frozen pairs | lower is less input within a pair</text>
  <rect x="30" y="83" width="14" height="10" fill="#66727C" />
  <text x="51" y="94" fill="#202C33" font-family="Arial, sans-serif" font-size="13" font-weight="400">Baseline</text>
