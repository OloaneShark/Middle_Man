  <line x1="500" y1="659" x2="500" y2="681" stroke="#677880" stroke-width="2" />
  <text x="28" y="718" fill="#5B6870" font-family="Arial, sans-serif" font-size="13" font-weight="400">Edit hints are historical; current AUTO bypasses edits. N/A is unreported, not zero.</text>
