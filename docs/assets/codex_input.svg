  <text x="28" y="587" fill="#087E72" font-family="Arial, sans-serif" font-size="13" font-weight="700">PASS / PASS</text>
  <text x="320" y="565" fill="#202C33" font-family="Arial, sans-serif" font-size="14" font-weight="700">363,533 -&gt; 494,991 input</text>
