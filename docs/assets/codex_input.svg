<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="743" viewBox="0 0 800 743" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Codex input changes across six independent frozen pairs</title>
  <desc id="chart-description">Grouped comparison of read-only offline navigation, historical MCP delivery, and edit-task experiments. One offline pair used fewer input tokens; MCP and two edit pairs used more. A timed-out edit run has no optimized token measurement. Bars show signed within-pair percentage changes on one shared scale from minus 100 to plus 100 percent.</desc>
  <rect x="0" y="0" width="800" height="743" fill="#FFFFFF" />
  <rect x="1" y="1" width="798" height="741" fill="none" stroke="#DCE3E5" />
  <text x="28" y="42" fill="#202C33" font-family="Arial, sans-serif" font-size="25" font-weight="700">Input-token change by experiment</text>
  <text x="28" y="69" fill="#5B6870" font-family="Arial, sans-serif" font-size="14" font-weight="400">Codex-reported usage | independent pairs, not pooled savings</text>
  <text x="320" y="101" fill="#087E72" font-family="Arial, sans-serif" font-size="13" font-weight="700">-100%  /  fewer</text>
  <text x="495" y="101" fill="#5B6870" font-family="Arial, sans-serif" font-size="13" font-weight="400">0</text>
  <text x="604" y="101" fill="#B44C39" font-family="Arial, sans-serif" font-size="13" font-weight="700">+100%  /  more</text>
  <rect x="20" y="120" width="760" height="30" fill="#EBF1F3" />
  <text x="28" y="141" fill="#202C33" font-family="Arial, sans-serif" font-size="14" font-weight="700">READ-ONLY REPOSITORY NAVIGATION</text>
  <text x="28" y="173" fill="#202C33" font-family="Arial, sans-serif" font-size="15" font-weight="700">Task A v4 / offline locator</text>
  <text x="28" y="195" fill="#087E72" font-family="Arial, sans-serif" font-size="13" font-weight="700">PASS / PASS</text>
  <text x="320" y="173" fill="#202C33" font-family="Arial, sans-serif" font-size="14" font-weight="700">86,515 -&gt; 38,269 input</text>
  <text x="758" y="173" fill="#087E72" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="end">-55.8%</text>
  <line x1="350" y1="203" x2="650" y2="203" stroke="#DCE3E5" stroke-width="8" />
  <line x1="500" y1="192" x2="500" y2="214" stroke="#677880" stroke-width="2" />
